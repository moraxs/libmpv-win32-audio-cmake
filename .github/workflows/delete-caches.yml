name: Delete all Actions caches

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-caches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all caches via REST API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          page=1
          while :; do
            resp=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/caches?per_page=100&page=$page")
            ids=$(echo "$resp" | jq -r '.actions_caches[].id // empty')
            [ -z "$ids" ] && break
            for id in $ids; do
              echo "Deleting cache $id"
              curl -s -X DELETE -w " (HTTP %{http_code})\n" -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/caches/$id"
            done
            page=$((page+1))
          done
          echo "Cache cleanup done"
